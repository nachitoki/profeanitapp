<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo Lámina Mundial</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Roboto:wght@400;700;900&display=swap');

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: #1a1a2e;
    margin: 0;
    font-family: 'Roboto', sans-serif;
  }

  .sticker-card {
    position: relative;
    width: 350px;
    height: 490px;
    background-color: #7FE5E4; /* Cyan background */
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    overflow: hidden;
    border: 5px solid white;
    transition: transform 0.3s ease;
    cursor: pointer;
  }

  .sticker-card:hover {
    transform: scale(1.05) translateY(-10px);
  }

  /* Efecto brillante holográfico */
  .sticker-card::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(
      to bottom right,
      rgba(255,255,255,0) 0%,
      rgba(255,255,255,0.1) 40%,
      rgba(255,255,255,0.5) 50%,
      rgba(255,255,255,0.1) 60%,
      rgba(255,255,255,0) 100%
    );
    transform: rotate(30deg) translateY(-100%);
    transition: transform 0.6s ease;
    pointer-events: none;
    z-index: 10;
  }

  .sticker-card:hover::after {
    transform: rotate(30deg) translateY(100%);
  }

  /* Fondo de números grandes (simulando 2026 / Colores del país) */
  .bg-number-left {
    position: absolute;
    top: 50px;
    left: -20px;
    font-family: 'Anton', sans-serif;
    font-size: 250px;
    color: #006600; /* Verde Portugal */
    line-height: 1;
    z-index: 1;
    opacity: 0.9;
  }

  .bg-number-right {
    position: absolute;
    top: 150px;
    right: -20px;
    font-family: 'Anton', sans-serif;
    font-size: 250px;
    color: #CC0000; /* Rojo Portugal */
    line-height: 1;
    z-index: 1;
    opacity: 0.9;
  }

  /* Logo superior derecho */
  .wc-logo {
    position: absolute;
    top: 15px;
    right: 15px;
    width: 60px;
    height: auto;
    z-index: 3;
    opacity: 0.9;
  }

  /* Imagen del jugador */
  .player-image {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    width: 320px;
    height: auto;
    z-index: 2;
  }

  /* Textos verticales y bandera (derecha) */
  .vertical-container {
    position: absolute;
    bottom: 120px;
    right: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 3;
  }

  .flag {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 2px solid white;
    object-fit: cover;
    margin-bottom: 5px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
  }

  .vertical-text {
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-family: 'Anton', sans-serif;
    font-size: 32px;
    color: transparent;
    -webkit-text-stroke: 1px white;
    letter-spacing: -5px;
    text-transform: uppercase;
  }

  /* Banner Inferior */
  .bottom-banner {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 90px;
    background-color: #007A7A; /* Teal */
    z-index: 4;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 5px;
    box-sizing: border-box;
    border-top: 3px solid white;
  }

  .player-name {
    color: white;
    font-family: 'Anton', sans-serif;
    font-size: 26px;
    margin: 0;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .player-stats {
    color: white;
    font-size: 12px;
    font-weight: 700;
    margin: 2px 0 5px 0;
  }

  .club-banner {
    width: 100%;
    background-color: #7FE5E4; /* Cyan matching bg */
    color: #007A7A;
    font-weight: 900;
    font-size: 12px;
    text-align: center;
    padding: 3px 0;
    text-transform: uppercase;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
  }

  .fake-panini {
    display: none;
  }

</style>
</head>
<body>

<div class="sticker-card">
  <!-- Background Shapes -->
  <div class="bg-number-left">2</div>
  <div class="bg-number-right">6</div>

  <!-- Copa del Mundo Logo -->
  <img src="./assets/stickers/trophy.png" alt="World Cup" class="wc-logo">

  <!-- Player Image (Descargada localmente) -->
  <img src="./assets/stickers/haaland.png" alt="Erling Haaland" class="player-image" style="mask-image: linear-gradient(to bottom, black 85%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, black 85%, transparent 100%); width: 420px; bottom: 70px;">

  <!-- Vertical Elements (Right) -->
  <div class="vertical-container">
    <div class="vertical-text">NOR</div>
  </div>

  <!-- Bottom Banner -->
  <div class="bottom-banner">
    <h1 class="player-name">ERLING HAALAND</h1>
    <p class="player-stats">21-07-2000 | 1,95 m | 88 kg</p>
    <div class="club-banner">
      MANCHESTER CITY
      <div class="fake-panini">PANINI</div>
    </div>
  </div>
</div>

</body>
</html>
